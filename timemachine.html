        <table class="data-table">
          <thead><tr><th>Data</th><th>Intervalo</th><th>Subtarefa</th><th>Nota</th><th class="num">Duração</th><th></th></tr></thead>

  `;
      // Wire up attach dropzone
      const drop = document.getElementById('attachDrop');
      const input = document.getElementById('attachInput');
      drop.addEventListener('click', () => input.click());
      input.addEventListener('change', (ev) => handleAttachmentFiles(ev.target.files));
      drop.addEventListener('dragover', (ev) => { ev.preventDefault(); drop.classList.add('drag-over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
      drop.addEventListener('drop', (ev) => {
        ev.preventDefault(); drop.classList.remove('drag-over');
        handleAttachmentFiles(ev.dataTransfer.files);
      });
    }

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1024 / 1024).toFixed(2) + ' MB';
    }

    async function handleAttachmentFiles(files) {
      const ref = view.taskRef; if (!ref) return;
      const t = findTask(ref.projectId, ref.taskId); if (!t) return;
      if (!t.attachments) t.attachments = [];
      for (const file of files) {
        if (!file.type.startsWith('image/')) { toast(`"${file.name}" não é imagem.`, 'error'); continue; }
        if (file.size > 4 * 1024 * 1024) { toast(`"${file.name}" muito grande (>4MB).`, 'error'); continue; }
        const dataUrl = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
        t.attachments.push({ id: uid(), name: file.name, dataUrl, size: file.size });
      }
      saveState(); render();
      toast('Anexos adicionados.', 'success');
    }
    function renameAttachment(id) {
      const ref = view.taskRef;
      const t = findTask(ref.projectId, ref.taskId);
      const a = t.attachments.find(x => x.id === id);
      const newName = prompt('Novo nome do arquivo:', a.name);
      if (newName && newName.trim()) { a.name = newName.trim(); saveState(); render(); }
    }
    function downloadAttachment(id) {
      const ref = view.taskRef;
      const t = findTask(ref.projectId, ref.taskId);
      const a = t.attachments.find(x => x.id === id);
      const link = document.createElement('a');
      link.href = a.dataUrl;
      link.download = a.name;
      document.body.appendChild(link); link.click(); link.remove();
    }
    function deleteAttachment(id) {
      if (!confirm('Excluir este anexo?')) return;
      const ref = view.taskRef;
      const t = findTask(ref.projectId, ref.taskId);
      t.attachments = t.attachments.filter(x => x.id !== id);
      saveState(); render();
    }
    function openImagePreview(id) {
      const ref = view.taskRef;
      const t = findTask(ref.projectId, ref.taskId);
      const a = t.attachments.find(x => x.id === id);
      if (!a) return;
      const root = document.getElementById('modal-root');
      root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <button class="close-x" onclick="closeModal()" style="position:fixed;top:20px;right:20px;background:rgba(0,0,0,0.6);color:#fff;width:40px;height:40px;border-radius:50%;border:none;display:grid;place-items:center;z-index:201"><svg width="20" height="20"><use href="#i-x"/></svg></button>
      <div class="modal image-preview-modal" style="background:transparent;border:none;box-shadow:none;max-width:95vw;max-height:95vh">
        <img src="${a.dataUrl}" alt="${escapeAttr(a.name)}" style="max-width:95vw;max-height:95vh;border-radius:8px;box-shadow:0 18px 48px rgba(0,0,0,0.6)" />
      </div>
    </div>`;
    }

    /* ============================================================
       MODALS
       ============================================================ */
    function openModal(html) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">${html}</div>`;
      const modal = root.querySelector('.modal');
      if (modal) {
        modal.addEventListener('keydown', (ev) => {
          if (ev.key !== 'Enter') return;
          if (ev.target.tagName === 'TEXTAREA') return;
          const saveBtn = modal.querySelector('.modal-footer .right .btn:not(.btn-secondary):not(.btn-danger)');
          if (saveBtn) { ev.preventDefault(); saveBtn.click(); }
        });
      }
    }

    function markFieldError(el) {
      if (!el) return;
      el.classList.add('field-error');
      const clear = () => el.classList.remove('field-error');
      el.addEventListener('input', clear, { once: true });
      el.addEventListener('change', clear, { once: true });
    }
    function markFieldErrorById(id) {
      markFieldError(document.getElementById(id));
    }
    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
      closeColorPopover();
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* --- Color popover --- */
    let popoverEl = null;
    function openColorPopover(triggerEl, currentColor, onPick) {
      closeColorPopover();
      const pop = document.createElement('div');
      pop.className = 'color-popover';
      pop.innerHTML = PALETTE.map(c => `
    <div class="swatch ${c === currentColor ? 'selected' : ''}" data-color="${c}" style="background:${c}">
      ${c === currentColor ? '<svg width="14" height="14"><use href="#i-check"/></svg>' : ''}
    </div>`).join('');
      pop.addEventListener('click', (e) => {
        const sw = e.target.closest('.swatch');
        if (sw && sw.dataset.color) {
          triggerEl.style.background = sw.dataset.color;
          onPick(sw.dataset.color);
          closeColorPopover();
        }
      });
      document.getElementById('popover-root').appendChild(pop);
      const r = triggerEl.getBoundingClientRect();
      // position: prefer below; flip if not enough room
      const popRect = pop.getBoundingClientRect();
      let top = r.bottom + 6, left = r.left;
      if (top + popRect.height > window.innerHeight - 10) top = r.top - popRect.height - 6;
      if (left + popRect.width > window.innerWidth - 10) left = window.innerWidth - popRect.width - 10;
      pop.style.left = Math.max(10, left) + 'px';
      pop.style.top = Math.max(10, top) + 'px';
      popoverEl = pop;
      setTimeout(() => {
        document.addEventListener('click', popoverOutsideClick, true);
      }, 0);
    }
    function popoverOutsideClick(e) {
      if (!popoverEl) return;
      if (!popoverEl.contains(e.target) && !e.target.classList.contains('color-trigger')) closeColorPopover();
    }
    function closeColorPopover() {
      if (popoverEl) { popoverEl.remove(); popoverEl = null; }
      document.removeEventListener('click', popoverOutsideClick, true);
    }

    /* --- Time entry modal --- */
    let timeEntryDraft = null;
    function openTimeEntryModal(opts = {}) {
      let entry;
      if (opts.id) {
        entry = state.timeEntries.find(e => e.id === opts.id);
        if (!entry) return;
      } else {
        const now = new Date();
        const startH = now.getHours();
        const startT = `${String(startH).padStart(2, '0')}:00`;
        const endH = (startH + 1) % 24;
        const endT = `${String(endH).padStart(2, '0')}:00`;

        entry = {
          id: null,
          projectId: opts.projectId || (state.projects[0] && state.projects[0].id) || '',
          taskId: opts.taskId || '',
          subtaskId: opts.subtaskId || null,
          date: opts.date || isoDate(now),
          startTime: opts.startTime || startT,
          endTime: opts.endTime || endT,
          durationMinutes: 60,
          note: ''
        };
        if (entry.projectId && !entry.taskId) {
          const p = findProject(entry.projectId);
          if (p && p.tasks[0]) entry.taskId = p.tasks[0].id;
        }
        if (entry.startTime && entry.endTime) {
          entry.durationMinutes = Math.max(0, timeStrToMinutes(entry.endTime) - timeStrToMinutes(entry.startTime));
        }
      }
      timeEntryDraft = JSON.parse(JSON.stringify(entry));
      timeEntryDraft.mode = opts.mode || (entry.startTime ? 'range' : (entry.id ? 'duration' : 'range'));
      if (!entry.id && entry.startTime) timeEntryDraft.mode = 'range';
      renderTimeEntryModal();
    }

    function renderTimeEntryModal() {
      const e = timeEntryDraft;
      if (state.projects.length === 0) {
        openModal(`
      <div class="modal">
        <div class="modal-header"><h2>Crie um projeto primeiro</h2><button class="icon-btn" onclick="closeModal()"><svg class="icon"><use href="#i-x"/></svg></button></div>
        <div class="modal-body"><p class="muted">Você precisa de pelo menos um projeto e uma tarefa para registrar tempo.</p></div>
        <div class="modal-footer"><span></span><div class="right">
          <button class="btn-secondary btn" onclick="closeModal()">Cancelar</button>
          <button class="btn" onclick="closeModal();openProjectModal()">Criar projeto</button>
        </div></div>
      </div>`);
        return;
      }
      const project = findProject(e.projectId);
      const taskOptions = project ? project.tasks.map(t => `<option value="${t.id}" ${e.taskId === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('') : '';
      const task = project && findTask(project.id, e.taskId);
      const subOptions = task ? `<option value="">— Nenhuma —</option>` + task.subtasks.map(s => `<option value="${s.id}" ${e.subtaskId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('') : '<option value="">—</option>';

      const dur = (e.mode === 'range' && e.startTime && e.endTime)
        ? Math.max(0, timeStrToMinutes(e.endTime) - timeStrToMinutes(e.startTime))
        : (e.durationMinutes || 0);
      const durDisplay = dur ? `${Math.floor(dur / 60)}h ${String(dur % 60).padStart(2, '0')}min` : '—';

      const html = `
    <div class="modal">
      <div class="modal-header">
        <h2>${e.id ? 'Editar registro' : 'Novo registro de tempo'}</h2>
        <button class="icon-btn" onclick="closeModal()"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Projeto <span class="req-star">*</span></label>
          <select id="modal-entry-project" class="select" onchange="updateDraft('projectId', this.value, true)">
            ${state.projects.map(p => `<option value="${p.id}" ${e.projectId === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Tarefa <span class="req-star">*</span></label>
            <select id="modal-entry-task" class="select" onchange="updateDraft('taskId', this.value, true)">
              ${taskOptions || '<option value="">—</option>'}
            </select>
            ${project && project.tasks.length === 0 ? `<button class="ghost-btn mt-8" onclick="closeModal();openTaskModal('${project.id}')"><svg class="icon" width="14" height="14"><use href="#i-plus"/></svg> Criar tarefa</button>` : ''}
          </div>
          <div class="field">
            <label>Subtarefa</label>
            <select class="select" onchange="updateDraft('subtaskId', this.value || null)" ${task && task.subtasks.length ? '' : 'disabled'}>
              <option value=""></option>
              ${task ? task.subtasks.map(s => `<option value="${s.id}" ${e.subtaskId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('') : ''}
            </select>
          </div>
        </div>
        <div class="field">
          <label>Data <span class="req-star">*</span></label>
          <input id="modal-entry-date" type="date" class="input" value="${e.date}" onchange="updateDraft('date', this.value)" />
        </div>
        <div class="field">
          <label>Como informar</label>
          <div class="segment">
            <button class="${e.mode === 'range' ? 'active' : ''}" onclick="setEntryMode('range')">Horário</button>
            <button class="${e.mode === 'duration' ? 'active' : ''}" onclick="setEntryMode('duration')">Duração</button>
          </div>
        </div>
        ${e.mode === 'range' ? `
          <div class="field-row">
            <div class="field">
              <label>Início</label>
              ${timeInputHtml('startTime', e.startTime)}
            </div>
            <div class="field">
              <label>Fim</label>
              ${timeInputHtml('endTime', e.endTime)}
            </div>
          </div>
          <div class="muted small" id="modal-duration-text" style="margin-bottom: 16px;">Duração: <strong>${durDisplay}</strong></div>
        ` : `
          <div class="field">
            <label>Duração</label>
            <input class="input" placeholder="ex.: 2h30m, 2:30, 1.5h, 150" value="${e.durationMinutes ? fmtHourCount(e.durationMinutes) : ''}" onchange="updateDraftDuration(this.value)" />
            <div class="muted small mt-8">Formatos aceitos: <code>2h30m</code>, <code>2:30</code>, <code>1,5h</code>, <code>150</code> (minutos).</div>
          </div>
        `}
        <div class="field">
          <label>Observação (aparece no calendário)</label>
          <textarea class="textarea" rows="2" oninput="updateDraft('note', this.value)" placeholder="Ex.: chamada com cliente, ajuste de bug…">${escapeHtml(e.note || '')}</textarea>
        </div>
      </div>
      <div class="modal-footer">
        <div>${e.id ? `<button class="btn btn-danger" onclick="deleteEntry('${e.id}')"><svg class="icon"><use href="#i-trash"/></svg> Excluir</button>` : ''}</div>
        <div class="right">
          <button class="btn-secondary btn" onclick="closeModal()">Cancelar</button>
          <button class="btn" onclick="saveEntry()">Salvar</button>
        </div>
      </div>
    </div>
  `;
      openModal(html);
    }
    function updateDraft(key, val, rerender) {
      timeEntryDraft[key] = val;
      if (key === 'projectId') {
        const p = findProject(val);
        timeEntryDraft.taskId = p && p.tasks[0] ? p.tasks[0].id : '';
        timeEntryDraft.subtaskId = null;
      }
      if (key === 'taskId') timeEntryDraft.subtaskId = null;
      if (key === 'startTime' || key === 'endTime') refreshDurationDisplay();
      if (rerender) renderTimeEntryModal();
    }
    function refreshDurationDisplay() {
      const e = timeEntryDraft;
      const el = document.getElementById('modal-duration-text');
      if (!el) return;
      let dur = 0;
      if (e.startTime && e.endTime) {
        const sm = timeStrToMinutes(e.startTime), em = timeStrToMinutes(e.endTime);
        if (sm !== null && em !== null) dur = Math.max(0, em - sm);
      }
      const display = dur ? `${Math.floor(dur / 60)}h ${String(dur % 60).padStart(2, '0')}min` : '—';
      el.innerHTML = `Duração: <strong>${display}</strong>`;
    }
    function updateDraftDuration(text) { timeEntryDraft.durationMinutes = parseDuration(text); }
    function setEntryMode(m) {
      timeEntryDraft.mode = m;
      if (m === 'duration') {
        if (timeEntryDraft.startTime && timeEntryDraft.endTime) {
          timeEntryDraft.durationMinutes = Math.max(0, timeStrToMinutes(timeEntryDraft.endTime) - timeStrToMinutes(timeEntryDraft.startTime));
        }
        timeEntryDraft.startTime = ''; timeEntryDraft.endTime = '';
      }
      renderTimeEntryModal();
    }
    function saveEntry() {
      const e = timeEntryDraft;
      if (!e.projectId) { markFieldErrorById('modal-entry-project'); toast('Selecione um projeto.', 'error'); return; }
      if (!e.taskId) { markFieldErrorById('modal-entry-task'); toast('Selecione uma tarefa.', 'error'); return; }
      if (!e.date) { markFieldErrorById('modal-entry-date'); toast('Informe a data.', 'error'); return; }
      if (e.mode === 'range') {
        if (!e.startTime || !e.endTime) { toast('Informe início e fim.', 'error'); return; }
        const sm = timeStrToMinutes(e.startTime), em = timeStrToMinutes(e.endTime);
        if (em <= sm) { toast('O horário final deve ser depois do inicial.', 'error'); return; }
        e.durationMinutes = em - sm;
      } else {
        if (!e.durationMinutes || e.durationMinutes <= 0) { toast('Informe uma duração válida.', 'error'); return; }
        e.startTime = null; e.endTime = null;
      }
      const persist = {
        id: e.id || uid(),
        projectId: e.projectId, taskId: e.taskId, subtaskId: e.subtaskId || null,
        date: e.date,
        startTime: e.mode === 'range' ? e.startTime : null,
        endTime: e.mode === 'range' ? e.endTime : null,
        durationMinutes: e.durationMinutes,
        note: e.note || ''
      };
      if (e.id) {
        const idx = state.timeEntries.findIndex(x => x.id === e.id);
        state.timeEntries[idx] = persist;
      } else state.timeEntries.push(persist);
      saveState(); closeModal(); toast('Registro salvo.', 'success'); render();
    }
    function deleteEntry(id) {
      if (!confirm('Excluir este registro?')) return;
      state.timeEntries = state.timeEntries.filter(x => x.id !== id);
      saveState(); closeModal(); render();
      toast('Registro excluído.');
    }

          </div>
        </div>
        <div class="field">
          <label>Categoria</label>
          <select class="select" onchange="projectDraft.categoryId=this.value||null">${catOptions}</select>
          ${state.categories.length === 0 ? '<div class="muted small mt-4">Nenhuma categoria criada ainda. Você pode criar em Tags & Categorias.</div>' : ''}
        </div>
        <div class="field-row">
          <div class="field">
            <label>Data de início <span class="req-star">*</span></label>
            <input id="modal-proj-start" type="date" class="input" value="${p.startDate || ''}" onchange="projectDraft.startDate=this.value;this.classList.remove('field-error')" />
          </div>

    function exportData() {
      const exportObj = {
        ...state,
        _filters: { tasksFilter, projectFilter, reportFilter, calendarMode: view.mode }
      };
      const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `timemachine-${isoDate(new Date())}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast('Dados exportados.', 'success');
    }
    function importData(ev) {
      const file = ev.target.files[0]; ev.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || typeof data !== 'object' || !Array.isArray(data.projects)) throw new Error('Formato inválido');
          if (!confirm('Substituir todos os dados atuais pelos importados?')) return;
          // Migration: if old schema (tagIds on project), move to tasks
          if (data.projects.some(p => Array.isArray(p.tagIds) && p.tasks && p.tasks.some(t => !('tagIds' in t)))) {
            data.projects.forEach(p => {
              if (p.tagIds) p.tasks.forEach(t => { if (!t.tagIds) t.tagIds = [...p.tagIds]; });
            });
          }
          // Ensure tags have color
          (data.tags || []).forEach((tg, i) => { if (!tg.color) tg.color = PALETTE[i % PALETTE.length]; });
          // Ensure tasks have attachments / description
          (data.projects || []).forEach(p => p.tasks.forEach(t => {
            if (!('tagIds' in t)) t.tagIds = [];
            if (!('attachments' in t)) t.attachments = [];
            if (!('description' in t)) t.description = '';
          }));
          state = {
            categories: data.categories || [],
            tags: data.tags || [],
            projects: data.projects || [],
            timeEntries: data.timeEntries || []
          };
          if (data._filters) {
            if (data._filters.tasksFilter) Object.assign(tasksFilter, data._filters.tasksFilter);
            if (data._filters.projectFilter) Object.assign(projectFilter, data._filters.projectFilter);
            if (data._filters.reportFilter) Object.assign(reportFilter, data._filters.reportFilter);
            if (data._filters.calendarMode) view.mode = data._filters.calendarMode;
            saveFilters();
          }
          saveState(); render();
          toast('Dados importados.', 'success');
        } catch (e) { toast('Arquivo inválido: ' + e.message, 'error'); }
      };
      reader.readAsText(file);
    }
    function clearDatabase() {
      if (!confirm('ATENÇÃO: isso vai apagar TODOS os dados (projetos, tarefas, registros, anexos, tags e categorias). Esta ação não pode ser desfeita. Continuar?')) return;
      if (!confirm('Tem certeza absoluta? Considere exportar antes para backup.')) return;
      state = emptyState();
      saveState(); render();
      toast('Todos os dados foram apagados.', 'success');
    }

      <div class="modal-body">
        <p><strong>Onde estão guardados?</strong> Tudo é salvo localmente no navegador deste dispositivo, dentro do <code>IndexedDB</code> da origem onde a página está sendo aberta. Nada é enviado pela rede. (Preferências de tema e filtros usam o <code>localStorage</code>, que também é local.)</p>
        <p><strong>Outros sites podem ler?</strong> Não. O <code>IndexedDB</code>, assim como o <code>localStorage</code>, é isolado por origem (protocolo + domínio + porta). Outros sites abertos no mesmo navegador não têm acesso a estes dados.</p>
        <p><strong>Outras pessoas na rede podem acessar?</strong> Não diretamente. Como nada trafega pela rede, ninguém consegue interceptar os dados. Eles só existem neste dispositivo.</p>

        <p><strong>Limpando o navegador?</strong> Ao limpar dados de site ou usar "Limpar dados de navegação", o IndexedDB pode ser apagado junto. Use o botão "Exportar JSON" regularmente para fazer backup.</p>
        <p><strong>Anexos de imagem:</strong> são salvos no <code>IndexedDB</code> (base64 dentro do JSON). O limite de armazenamento do IndexedDB é muito maior que o antigo localStorage — geralmente centenas de MB até GB, dependendo do espaço disponível no dispositivo. O app ainda rejeita imagens individuais acima de 4 MB para manter o desempenho.</p>

    function toast(msg, type, durationMs) {
      const el = document.createElement('div');
      el.className = 'toast' + (type ? ' ' + type : '');
      el.textContent = msg;
      document.getElementById('toast-stack').appendChild(el);
      const total = durationMs || 2400;
      setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; el.style.transition = 'all 0.25s'; }, total);
      setTimeout(() => el.remove(), total + 300);
    }

    /* ============================================================
       PWA — Manifest (Blob URL) + Service Worker registration
       ============================================================ */
    (async function setupPWA() {
      // 1. Base SVG for regular icons
      const baseSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c4dff"/><stop offset="100%" stop-color="#c84df0"/></linearGradient></defs><circle cx="256" cy="256" r="256" fill="url(#g)"/><circle cx="256" cy="256" r="144" fill="none" stroke="white" stroke-width="22"/><path d="M256 144v112l60 40" stroke="white" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      // 2. Maskable SVG (with safe-zone padding)
      const maskableSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c4dff"/><stop offset="100%" stop-color="#c84df0"/></linearGradient></defs><rect width="512" height="512" fill="#15131e"/><circle cx="256" cy="256" r="190" fill="url(#g)"/><circle cx="256" cy="256" r="110" fill="none" stroke="white" stroke-width="18"/><path d="M256 160v96l50 30" stroke="white" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      // Converte SVG para PNG nativo em Base64 para garantir compatibilidade com PWA no Windows
      function getPngDataUri(svg, size) {
        return new Promise(resolve => {
          const img = new Image();
          img.src = 'data:image/svg+xml;base64,' + btoa(svg);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            canvas.getContext('2d').drawImage(img, 0, 0, size, size);
            resolve(canvas.toDataURL('image/png'));
          };
          img.onerror = () => resolve('data:image/svg+xml;base64,' + btoa(svg));
        });
      }

      const icon192 = await getPngDataUri(baseSvg, 192);
      const icon512 = await getPngDataUri(baseSvg, 512);
      const maskable512 = await getPngDataUri(maskableSvg, 512);

      const manifest = {
        name: 'TimeMachine',
        short_name: 'TimeMachine',
        description: 'Acompanhamento de tempo de tarefas e projetos',
        start_url: 'https://elmojunior.github.io/TimeMachine/timemachine.html',
        scope: 'https://elmojunior.github.io/TimeMachine/',
        display: 'standalone',
        background_color: '#15131e',
        theme_color: '#7c4dff',
        orientation: 'any',
        lang: 'pt-BR',
        icons: [
          { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: maskable512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };

      try {
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
      } catch (e) {
        console.warn('[PWA] Could not inject manifest:', e);
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js', { scope: '/TimeMachine/' })
            .then(r => console.info('[PWA] Service Worker registered, scope:', r.scope))
            .catch(e => console.warn('[PWA] Service Worker registration failed:', e));
        });
      }
    })();

    /* ============================================================
       BOOT  (async because IndexedDB load is async)
       ============================================================ */
    async function init() {
      try {
        _idb = await openIDB();

        // One-time migration: if old localStorage data exists, move it to IDB.
        const legacyRaw = localStorage.getItem(LS_MIGRATE_KEY);
        if (legacyRaw) {
          try {
            const legacyData = JSON.parse(legacyRaw);
            await idbSet(_idb, STATE_KEY, legacyData);
            localStorage.removeItem(LS_MIGRATE_KEY);
            console.info('TimeMachine: migrated data from localStorage → IndexedDB.');
          } catch (e) {
            console.warn('Migration failed, will use IDB as-is:', e);
          }
        }

        const loaded = await idbGet(_idb, STATE_KEY);
        state = loaded || emptyState();
      } catch (e) {
        console.error('IndexedDB unavailable, falling back to empty state:', e);
        state = emptyState();
      }

      initRouter();
      loadFilters();
      render();
    }

    init();
  </script>

</body>

</html>
