              <use href="#i-moon" />
            </svg></button>
          <button data-theme="auto" title="Seguir sistema"><svg class="icon">
              <use href="#i-monitor" />
            </svg></button>
        </div>
        <button class="ghost-btn" onclick="exportData()" title="Exportar dados em JSON"><svg class="icon" width="14"
            height="14">
            <use href="#i-download" />
          </svg> Exportar JSON</button>
        <button class="ghost-btn" onclick="document.getElementById('importFile').click()"
          title="Importar dados de JSON"><svg class="icon" width="14" height="14">
            <use href="#i-upload" />
          </svg> Importar JSON</button>
        <button class="ghost-btn danger" onclick="clearDatabase()" title="Apagar todos os dados"><svg class="icon"
            width="14" height="14">
            <use href="#i-broom" />
          </svg> Limpar dados</button>
        <button class="ghost-btn" onclick="openSecurityInfo()" title="Sobre a segurança dos dados"><svg class="icon"
            width="14" height="14">
            <use href="#i-shield" />
          </svg> Sobre os dados</button>
        <input type="file" id="importFile" accept="application/json" style="display:none"
          onchange="importData(event)" />
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" onclick="toggleMobileNav()"><svg class="icon">
            <use href="#i-menu" />
          </svg></button>
        <h1 id="page-title">Calendário</h1>
        <div class="spacer"></div>
        <div id="topbar-extras"></div>
        <button class="btn-icon-round" onclick="openTimeEntryModal()" title="Novo registro de tempo"><svg class="icon">
            <use href="#i-timer-add" />
          </svg></button>
      </header>
      <div class="content" id="view-root"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="popover-root"></div>
  <div class="toast-stack" id="toast-stack"></div>

  <script>
    /* ============================================================
       STATE & PERSISTENCE  (IndexedDB)
       ============================================================ */
    const IDB_NAME = 'timemachine_db';
    const IDB_VERSION = 1;
    const IDB_STORE = 'kv';           // generic key-value store
    const STATE_KEY = 'state_v2';     // key used inside the store
    const THEME_KEY = 'timemachine_theme';        // still in localStorage (tiny string)
    const FILTERS_KEY = 'timemachine_filters_v1';   // still in localStorage (tiny string)
    const LS_MIGRATE_KEY = 'timemachine_data_v2';   // old localStorage key to migrate from
    const PALETTE = ['#7c4dff', '#5e9bff', '#2dba6b', '#f1a836', '#e34c4c', '#e91e63', '#a259ff', '#00bcd4', '#ff7043', '#9ccc65', '#26a69a', '#7986cb'];

    let state;
    let view = { name: 'calendar', mode: 'week', refDate: stripTime(new Date()), taskRef: null };
    let _idb = null; // cached IDBDatabase

    function openIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function idbGet(db, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbSet(db, key, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const req = tx.objectStore(IDB_STORE).put(value, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function emptyState() {
      return { categories: [], tags: [], projects: [], timeEntries: [] };
    }

    // saveState() stays synchronous from the callers' perspective.
    // The actual IndexedDB write runs in the background (fire-and-forget).
    function saveState() {
      if (!_idb) return; // DB not ready yet (should not happen after init)
      const snapshot = JSON.parse(JSON.stringify(state)); // safe clone
      idbSet(_idb, STATE_KEY, snapshot).catch((e) => {
        console.error('saveState IDB error:', e);
        toast('Erro ao salvar dados: ' + e.message, 'error');
      });
    }

    // Filters & theme are tiny strings — keep them in localStorage.
    function saveFilters() {
      try {
        localStorage.setItem(FILTERS_KEY, JSON.stringify({
          tasksFilter, projectFilter, reportFilter, recordsFilter, calendarMode: view.mode
        }));
      } catch (e) { }
    }
    function loadFilters() {
      try {
        const raw = localStorage.getItem(FILTERS_KEY);
        if (!raw) return;
        const f = JSON.parse(raw);
        if (f.tasksFilter) Object.assign(tasksFilter, f.tasksFilter);
        if (f.projectFilter) Object.assign(projectFilter, f.projectFilter);
        if (f.reportFilter) Object.assign(reportFilter, f.reportFilter);
        if (f.recordsFilter) Object.assign(recordsFilter, f.recordsFilter);
        if (f.calendarMode) view.mode = f.calendarMode;
      } catch (e) { console.error('loadFilters:', e); }
    }

    /* ============================================================
       THEME MANAGEMENT
       ============================================================ */
    function getStoredTheme() { return localStorage.getItem(THEME_KEY) || 'auto'; }
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem(THEME_KEY, t);
      document.querySelectorAll('#themeSwitcher button').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === t);
      });
    }
    applyTheme(getStoredTheme());
    document.querySelectorAll('#themeSwitcher button').forEach(b => {
      b.addEventListener('click', () => applyTheme(b.dataset.theme));
    });

    /* ============================================================
       UTILITIES
       ============================================================ */
    function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

    function stripTime(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
    // Sunday-first week
    function startOfWeek(d) {
      const x = stripTime(d);
      const day = x.getDay(); // 0=Sun .. 6=Sat
      x.setDate(x.getDate() - day);
      return x;
    }
    function endOfWeek(d) { const x = startOfWeek(d); x.setDate(x.getDate() + 6); return x; }
    function startOfMonth(d) { const x = stripTime(d); x.setDate(1); return x; }
    function endOfMonth(d) { const x = startOfMonth(d); x.setMonth(x.getMonth() + 1); x.setDate(0); return x; }
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function addMonths(d, n) { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; }
    function isoDate(d) {
      const x = (d instanceof Date) ? d : new Date(d);
      const y = x.getFullYear(), m = String(x.getMonth() + 1).padStart(2, '0'), day = String(x.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
    function isToday(d) { return isoDate(d) === isoDate(new Date()); }
    function isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; }
    function fmtMonthYear(d) { return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); }
    function fmtDow(d) { return d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''); }
    function fmtDateBR(s) { if (!s) return ''; const d = parseDate(s); return d.toLocaleDateString('pt-BR'); }
    function fmtMinutes(min) {
      if (!min || min < 0) return '0h';
      const h = Math.floor(min / 60), m = min % 60;
      if (h === 0) return `${m}min`;
      if (m === 0) return `${h}h`;
      return `${h}h ${m}min`;
    }
    function fmtHourCount(min) {
      if (!min) return '0:00';
      const h = Math.floor(min / 60), m = min % 60;
      return `${h}:${String(m).padStart(2, '0')}`;
    }
    function parseDuration(text) {
      if (!text) return 0;
      text = String(text).trim().toLowerCase();
      if (text.includes(':')) {
        const [h, m] = text.split(':').map(s => parseInt(s, 10) || 0);
        return h * 60 + m;
      }
      let total = 0;
      const hMatch = text.match(/(\d+(?:[.,]\d+)?)\s*h/);
      const mMatch = text.match(/(\d+)\s*m(?!s)/);
      if (hMatch) total += Math.round(parseFloat(hMatch[1].replace(',', '.')) * 60);
      if (mMatch) total += parseInt(mMatch[1], 10);
      if (!hMatch && !mMatch) {
        const num = parseFloat(text.replace(',', '.'));
        if (!isNaN(num)) total = Math.round(num * 60);
      }
      return total;
    }
    function timeStrToMinutes(t) {
      if (!t) return null;
      const [h, m] = t.split(':').map(s => parseInt(s, 10));
      return h * 60 + (m || 0);
    }
    function minutesToTimeStr(min) {
      const h = Math.floor(min / 60), m = min % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

    function getTimeOptions() {
      const opts = [];
      for (let h = 0; h < 24; h++) {
        const hh = String(h).padStart(2, '0');
        for (let m = 0; m < 60; m += 15) {
          opts.push(`${hh}:${String(m).padStart(2, '0')}`);
        }
      }
      return opts;
    }

    function timeInputHtml(key, value) {
      return `
      <div class="time-combo">
        <input type="text" class="input time-input" data-key="${key}" value="${escapeAttr(value)}" 
               onfocus="showTimeDropdown(this)" 
               oninput="updateDraft('${key}', this.value)"
               placeholder="HH:mm" />
      </div>`;
    }

    let timePopoverEl = null;
    function showTimeDropdown(input) {
      closeTimeDropdown();
      const pop = document.createElement('div');
      pop.className = 'time-dropdown show';
      const key = input.dataset.key;
      pop.innerHTML = getTimeOptions().map(t => `<div class="time-option" data-time="${t}">${t}</div>`).join('');

      pop.addEventListener('mousedown', (e) => {
        const opt = e.target.closest('.time-option');
        if (opt) {
          input.value = opt.dataset.time;
          updateDraft(key, opt.dataset.time);
          closeTimeDropdown();
        }
      });

      document.getElementById('popover-root').appendChild(pop);

      const r = input.getBoundingClientRect();
      pop.style.position = 'fixed';
      pop.style.width = r.width + 'px';
      pop.style.left = r.left + 'px';

      const popRect = pop.getBoundingClientRect();
      let top = r.bottom + 4;
      if (top + 200 > window.innerHeight) top = r.top - 204; // 200 is max-height + 4px margin
      pop.style.top = top + 'px';

      timePopoverEl = pop;

      // Scroll to current value
      const currentVal = input.value;
      const optEls = pop.querySelectorAll('.time-option');
      let target = null;
      optEls.forEach(o => {
        if (o.dataset.time === currentVal) {
          o.classList.add('selected');
          target = o;
        }
      });
      if (target) {
        setTimeout(() => {
          target.scrollIntoView({ block: 'center' });
        }, 10);
      }

      setTimeout(() => { document.addEventListener('mousedown', timePopoverOutsideClick); }, 0);
    }

    function timePopoverOutsideClick(e) {
      if (!timePopoverEl) return;
      if (!timePopoverEl.contains(e.target) && !e.target.classList.contains('time-input')) closeTimeDropdown();
    }

    function closeTimeDropdown() {
      if (timePopoverEl) { timePopoverEl.remove(); timePopoverEl = null; }
      document.removeEventListener('mousedown', timePopoverOutsideClick);
    }

    function fadeColor(hex, alpha) {
      if (!hex || hex[0] !== '#') return `rgba(124,77,255,${alpha})`;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function getContrastColor(hex) {
      if (!hex || hex[0] !== '#') return '#ffffff';
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
      return (yiq >= 150) ? '#1f1d28' : '#ffffff';
    }

    function chipBgStyle(color) {
      const a = getComputedStyle(document.documentElement).getPropertyValue('--chip-alpha').trim() || '0.16';
      // For chips, we want the text to be readable. If the color is too light, we darken it for text.
      let textColor = color;
      if (color && color[0] === '#') {
        const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
        const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
        if (yiq > 200) textColor = '#5e2bd6'; // Use a strong primary if the tag color is too faint
      }
      return `background:${fadeColor(color, parseFloat(a))};color:${textColor};border-color:${fadeColor(color, parseFloat(a) + 0.1)}`;
    }
    function colorTriggerHtml(color, onclickJs) {
      return `<button type="button" class="color-trigger" style="background:${escapeAttr(color)}" onclick="${onclickJs}" title="Escolher cor"></button>`;
    }
    function onTagColorPick(c) {
      tagDraft.color = c;
      const ch = document.getElementById('color-preview');
      if (ch) ch.setAttribute('style', chipBgStyle(c));
    }
    function onCatColorPick(c) {
      categoryDraft.color = c;
      const ch = document.getElementById('color-preview');
      if (ch) ch.setAttribute('style', chipBgStyle(c));
    }
    function onProjectColorPick(c) {
      projectDraft.color = c;
    }

    function findProject(id) { return state.projects.find(p => p.id === id); }
    function findTask(projectId, taskId) {
      const p = findProject(projectId);
      return p && p.tasks.find(t => t.id === taskId);
    }
    function findSubtask(projectId, taskId, subId) {
      const t = findTask(projectId, taskId);
      return t && t.subtasks.find(s => s.id === subId);
    }
    function getTagById(id) { return state.tags.find(t => t.id === id); }
    function getCategoryById(id) { return state.categories.find(c => c.id === id); }

    function projectTotalMinutes(projectId) {
      return state.timeEntries.filter(e => e.projectId === projectId).reduce((s, e) => s + (e.durationMinutes || 0), 0);
    }
    function taskTotalMinutes(projectId, taskId) {
      return state.timeEntries.filter(e => e.projectId === projectId && e.taskId === taskId).reduce((s, e) => s + (e.durationMinutes || 0), 0);
    }
    function projectComputedDates(p) {
      const dates = state.timeEntries.filter(e => e.projectId === p.id).map(e => e.date).sort();
      let start = p.startDate;
      let end = p.endDate;
      if (dates.length) {
        const earliest = dates[0];
        const latest = dates[dates.length - 1];
        if (!start || earliest < start) start = earliest;
        const allCompleted = p.tasks.length > 0 && p.tasks.every(t => t.completed);
        if (allCompleted && (!end || latest > end)) end = latest;
      }
      return { start, end };
    }

    /* ============================================================
       RENDER ROOT
       ============================================================ */
    function render() {
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.view === view.name);
      });
      document.getElementById('page-title').textContent = {
        calendar: 'Calendário', tasks: 'Tarefas', records: 'Registros', projects: 'Projetos',
        tags: 'Tags & Categorias', reports: 'Relatórios', 'task-detail': 'Detalhes da tarefa'
      }[view.name] || 'TimeMachine';

      document.getElementById('topbar-extras').innerHTML = '';
      const root = document.getElementById('view-root');
      switch (view.name) {
        case 'calendar': renderCalendar(root); break;
        case 'tasks': renderTasks(root); break;
        case 'records': renderRecords(root); break;
        case 'projects': renderProjects(root); break;
        case 'tags': renderTags(root); break;
        case 'reports': renderReports(root); break;
        case 'task-detail': renderTaskDetail(root); break;
      }
      syncUrl();
    }

    /* ============================================================
       ROUTING
       ============================================================ */
    function syncUrl() {
      let hash = `#/${view.name}`;
      if (view.name === 'calendar') {
        hash += `/${view.mode}/${isoDate(view.refDate)}`;
      } else if (view.name === 'task-detail' && view.taskRef) {
        hash += `/${view.taskRef.projectId}/${view.taskRef.taskId}`;
      }
      if (location.hash !== hash) {
        // use replaceState to not clutter history on every minor change, 
        // but can use pushState if we want 'back' to work between views.
        // User asked for "stay in same place after refresh", so replace is safer.
        history.replaceState(null, '', hash);
      }
    }

    function initRouter() {
      const h = location.hash;
      if (!h || !h.startsWith('#/')) return;
      const parts = h.slice(2).split('/');
      const name = parts[0];
      const valid = ['calendar', 'tasks', 'records', 'projects', 'tags', 'reports', 'task-detail'];
      if (valid.includes(name)) {
        view.name = name;
        if (name === 'calendar') {
          if (parts[1]) view.mode = parts[1];
          if (parts[2]) view.refDate = parseDate(parts[2]);
        } else if (name === 'task-detail' && parts[1] && parts[2]) {
          view.taskRef = { projectId: parts[1], taskId: parts[2] };
        }
      }
    }

    window.addEventListener('hashchange', () => {
      initRouter();
      render();
    });

    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        view.name = el.dataset.view;
        view.taskRef = null;
        closeMobileNav();
        render();
      });
    });
    function toggleMobileNav() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('scrim').classList.toggle('show');
    }
    function closeMobileNav() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('scrim').classList.remove('show');
    }

    /* ============================================================
       CALENDAR VIEW
       ============================================================ */
    const HOUR_HEIGHT = 56;
    const DAY_START_HOUR = 6;
    const DAY_END_HOUR = 22;
    const SNAP_MINUTES = 30;

    function renderCalendar(root) {
      const extras = document.getElementById('topbar-extras');
      const range = currentRange();
      let label;
      if (view.mode === 'week') {
        const sm = range.start.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
        const em = range.end.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
        label = (range.start.getMonth() === range.end.getMonth())
          ? `${range.start.getDate()}–${range.end.getDate()} ${sm} ${range.end.getFullYear()}`
          : `${range.start.getDate()} ${sm} – ${range.end.getDate()} ${em} ${range.end.getFullYear()}`;
      } else {
        label = capitalize(fmtMonthYear(view.refDate));
      }
      extras.innerHTML = `
    <div class="row gap-sm" style="flex-wrap:wrap">
      <div class="date-nav">
        <button class="nav-btn" onclick="navCalendar(-1)"><svg class="icon" width="14" height="14"><use href="#i-chev-l"/></svg></button>
        <span class="label">${escapeHtml(label)}</span>
        <button class="nav-btn" onclick="navCalendar(1)"><svg class="icon" width="14" height="14"><use href="#i-chev-r"/></svg></button>
      </div>
      <button class="btn-secondary btn" onclick="goToday()" style="padding:6px 10px;font-size:12.5px">Hoje</button>
      <div class="view-toggle">
        <button class="${view.mode === 'week' ? 'active' : ''}" onclick="setMode('week')">Semana</button>
        <button class="${view.mode === 'month' ? 'active' : ''}" onclick="setMode('month')">Mês</button>
      </div>
    </div>
  `;

      const totalMin = sumEntriesInRange(range.start, range.end);
      const summary = `
    <div class="calendar-summary">
      <div class="total">${fmtHourCount(totalMin)} <small>${view.mode === 'week' ? 'na semana' : 'no mês'}</small></div>
      <div class="muted small">-</div>
      <div class="muted small">${state.timeEntries.filter(e => entryInRange(e, range)).length} registros</div>
    </div>
  `;

      if (view.mode === 'week') {
        root.innerHTML = `<div class="card calendar-card">${summary}${renderWeekGrid(range)}</div>`;
        attachCalendarEvents();
      } else {
        root.innerHTML = `<div class="card calendar-card">${summary}${renderMonthGrid()}</div>`;
        attachMonthEvents();
      }
    }

    function currentRange() {
      if (view.mode === 'week') {
        return { start: startOfWeek(view.refDate), end: endOfWeek(view.refDate) };
      }
      return { start: startOfMonth(view.refDate), end: endOfMonth(view.refDate) };
    }
    function entryInRange(e, range) { const d = parseDate(e.date); return d >= range.start && d <= range.end; }
    function sumEntriesInRange(start, end) {
      return state.timeEntries.filter(e => {
        const d = parseDate(e.date);
        return d >= start && d <= end;
      }).reduce((s, e) => s + (e.durationMinutes || 0), 0);
    }
    function navCalendar(dir) {
      if (view.mode === 'week') view.refDate = addDays(view.refDate, dir * 7);
      else view.refDate = addMonths(view.refDate, dir);
      render();
    }
    function goToday() { view.refDate = stripTime(new Date()); render(); }
    function setMode(m) { view.mode = m; saveFilters(); render(); }

    function renderWeekGrid(range) {
      const days = []; for (let i = 0; i < 7; i++) days.push(addDays(range.start, i));
      const headRow = ['<div class="gutter" style="border-right:none"></div>']
        .concat(days.map(d => {
          const totalDay = state.timeEntries.filter(e => e.date === isoDate(d))
            .reduce((s, e) => s + (e.durationMinutes || 0), 0);
          return `<div class="day-head ${isToday(d) ? 'is-today' : ''} ${isWeekend(d) ? 'is-weekend' : ''}">
        <div class="dow">${escapeHtml(fmtDow(d))}</div>
        <div class="num">${d.getDate()}</div>
        <div class="total">${totalDay ? fmtHourCount(totalDay) : '0:00'}</div>
      </div>`;
        })).join('');

      const untimedRow = ['<div class="gutter" style="border-right:none"></div>']
        .concat(days.map(d => {
          const dateStr = isoDate(d);
          const untimed = state.timeEntries.filter(e => e.date === dateStr && !e.startTime);
          const chips = untimed.map(e => {
            const p = findProject(e.projectId);
            const t = p && findTask(p.id, e.taskId);
            return `<div class="untimed-chip" data-entry="${e.id}" style="border-left-color:${escapeAttr(p?.color || '#7c4dff')}" title="${escapeAttr((p ? p.name + ' • ' : '') + (t ? t.name : '') + (e.note ? ' — ' + e.note : ''))}">
          <span class="truncate grow">${escapeHtml((t ? t.name : '(sem tarefa)'))}${e.note ? ' — ' + escapeHtml(e.note) : ''}</span>
          <strong>${fmtHourCount(e.durationMinutes)}</strong>
        </div>`;
          }).join('');
          return `<div class="untimed-strip" data-day="${dateStr}">${chips}</div>`;
        })).join('');

      const hours = [];
      for (let h = DAY_START_HOUR; h < DAY_END_HOUR; h++) hours.push(h);
      const gutterCells = '<div class="gutter">' +
        hours.map(h => `<div class="hour">${String(h).padStart(2, '0')}:00</div>`).join('') + '</div>';

      const dayCols = days.map(d => {
        const dateStr = isoDate(d);
        const cells = hours.map(h => `<div class="hour-cell" data-day="${dateStr}" data-hour="${h}"></div>`).join('');
        const entries = state.timeEntries.filter(e => e.date === dateStr && e.startTime && e.endTime);
        const layout = layoutOverlaps(entries);
        const blocks = entries.map(e => {
          const p = findProject(e.projectId);
          const t = p && findTask(p.id, e.taskId);
          const sub = e.subtaskId && t ? t.subtasks.find(s => s.id === e.subtaskId) : null;
          const startMin = timeStrToMinutes(e.startTime);
          const endMin = timeStrToMinutes(e.endTime);
          const dayStartMin = DAY_START_HOUR * 60;
          const top = ((startMin - dayStartMin) / 60) * HOUR_HEIGHT;
          const height = Math.max(28, ((endMin - startMin) / 60) * HOUR_HEIGHT - 2);
          const bg = p?.color || '#7c4dff';
          const textColor = getContrastColor(bg);
          const lay = layout[e.id] || { col: 0, cols: 1 };
          const widthPct = 100 / lay.cols;
          const leftPct = lay.col * widthPct;
          const availableForNote = height - 54;
          const maxLines = Math.max(1, Math.floor(availableForNote / 14));
          const showMeta = height > 42;
          const showTime = height > 32;

          return `<div class="entry-block" data-entry="${e.id}"
        style="top:${top}px;height:${height}px;background:${bg};color:${textColor};left:calc(${leftPct}% + 3px);width:calc(${widthPct}% - 6px)">
        <div class="eb-title">${escapeHtml(t ? t.name : '(sem tarefa)')}</div>
        ${showMeta ? `<div class="eb-meta">${escapeHtml(p ? p.name : '')}${sub ? ' • ' + escapeHtml(sub.name) : ''}</div>` : ''}
        ${e.note && availableForNote > 10 ? `<div class="eb-note" style="-webkit-line-clamp: ${maxLines}">${escapeHtml(e.note)}</div>` : ''}
        ${showTime ? `<div class="eb-time" style="border-top-color:${fadeColor(textColor, 0.2)}">${e.startTime}–${e.endTime} · ${fmtHourCount(e.durationMinutes)}</div>` : ''}
      </div>`;
        }).join('');
        return `<div class="day-col ${isWeekend(d) ? 'is-weekend' : ''}" data-day="${dateStr}">${cells}${blocks}</div>`;
      }).join('');

      return `
      <div class="cal-week" id="weekGrid">
        <div class="cal-week-header" id="weekGridHead">
          ${headRow}
          ${untimedRow}
        </div>
        <div class="cal-week-scrollable" id="weekGridBody">
          ${gutterCells}
          ${dayCols}
        </div>
      </div>`;
    }

    function layoutOverlaps(entries) {
      const sorted = [...entries].sort((a, b) => timeStrToMinutes(a.startTime) - timeStrToMinutes(b.startTime));
      const result = {};
      let cluster = [], clusterEnd = -1;
      const flush = () => {
        if (!cluster.length) return;
        const cols = [];
        cluster.forEach(e => {
          const start = timeStrToMinutes(e.startTime);
          let placed = false;
          for (let c = 0; c < cols.length; c++) {
            const last = cols[c][cols[c].length - 1];
            if (timeStrToMinutes(last.endTime) <= start) {
              cols[c].push(e); placed = true;
              result[e.id] = { col: c, cols: 0 }; break;
            }
          }
          if (!placed) {
            cols.push([e]);
            result[e.id] = { col: cols.length - 1, cols: 0 };
          }
        });
        cluster.forEach(e => result[e.id].cols = cols.length);
        cluster = []; clusterEnd = -1;
      };
      sorted.forEach(e => {
        const start = timeStrToMinutes(e.startTime);
        const end = timeStrToMinutes(e.endTime);
        if (cluster.length === 0 || start < clusterEnd) {
          cluster.push(e); clusterEnd = Math.max(clusterEnd, end);
        } else {
          flush(); cluster.push(e); clusterEnd = end;
        }
      });
      flush();
      return result;
    }

    function attachCalendarEvents() {
      const head = document.getElementById('weekGridHead');
      const body = document.getElementById('weekGridBody');
      if (head && body) {
        body.addEventListener('scroll', () => {
          head.scrollLeft = body.scrollLeft;
        });
      }

      document.querySelectorAll('.cal-week .hour-cell').forEach(el => {
        el.addEventListener('click', (ev) => {
          if (didDragMove) { didDragMove = false; return; }
          openTimeEntryModal({
            date: el.dataset.day,
            startTime: `${String(el.dataset.hour).padStart(2, '0')}:00`,
            endTime: `${String(parseInt(el.dataset.hour) + 1).padStart(2, '0')}:00`,
            mode: 'range'
          });
        });
      });
      document.querySelectorAll('.cal-week .untimed-chip').forEach(el => {
        el.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openTimeEntryModal({ id: el.dataset.entry });
        });
        el.addEventListener('contextmenu', (ev) => onEntryContextMenu(ev, el.dataset.entry));
      });
      document.querySelectorAll('.cal-week .untimed-strip').forEach(el => {
        el.addEventListener('click', (ev) => {
          if (ev.target !== el) return;
          openTimeEntryModal({ date: el.dataset.day, mode: 'duration' });
        });
      });
      document.querySelectorAll('.cal-week .entry-block').forEach(el => {
        el.addEventListener('pointerdown', startEntryDrag);
        el.addEventListener('contextmenu', (ev) => onEntryContextMenu(ev, el.dataset.entry));
      });
    }

    /* --- Drag and resize on calendar --- */
    let dragCtx = null;
    let didDragMove = false;
    function startEntryDrag(ev) {
      if (ev.button !== 0) return;
      const block = ev.currentTarget;
      const rect = block.getBoundingClientRect();
      const offsetY = ev.clientY - rect.top;
      let mode = 'move';
      if (offsetY <= 8) mode = 'resize-top';
      else if (rect.height - offsetY <= 8) mode = 'resize-bottom';
      const entryId = block.dataset.entry;
      const entry = state.timeEntries.find(e => e.id === entryId);
      if (!entry) return;
      const dayCol = block.parentElement; // .day-col
      const colRect = dayCol.getBoundingClientRect();
      dragCtx = {
        entryId, mode, block, dayCol,
        startX: ev.clientX, startY: ev.clientY,
        initialTop: ((timeStrToMinutes(entry.startTime) - DAY_START_HOUR * 60) / 60) * HOUR_HEIGHT,
        initialHeight: ((timeStrToMinutes(entry.endTime) - timeStrToMinutes(entry.startTime)) / 60) * HOUR_HEIGHT,
        initialLeftPx: 0, // not needed; we translate
        colRect,
        allCols: [...document.querySelectorAll('.cal-week .day-col')],
        targetDay: entry.date,
        snappedDx: 0, snappedDy: 0,
        moved: false
      };
      block.setPointerCapture(ev.pointerId);
      block.classList.add('dragging');
      document.getElementById('weekGrid')?.classList.add('dragging');
      document.body.style.userSelect = 'none';
      block.addEventListener('pointermove', onEntryDrag);
      block.addEventListener('pointerup', endEntryDrag);
      block.addEventListener('pointercancel', endEntryDrag);
      ev.preventDefault();
    }
    function onEntryDrag(ev) {
      if (!dragCtx) return;
      const dx = ev.clientX - dragCtx.startX;
      const dy = ev.clientY - dragCtx.startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) { dragCtx.moved = true; didDragMove = true; }
      // Snap dy to SNAP_MINUTES (=> px)
      const snapPx = HOUR_HEIGHT * (SNAP_MINUTES / 60);
      const snappedDy = Math.round(dy / snapPx) * snapPx;
      dragCtx.snappedDy = snappedDy;
      if (dragCtx.mode === 'move') {
        // Detect target column via cursor X
        let targetCol = dragCtx.dayCol, targetDx = 0;
        for (const col of dragCtx.allCols) {
          const r = col.getBoundingClientRect();
          if (ev.clientX >= r.left && ev.clientX <= r.right) {
            targetCol = col;
            targetDx = r.left - dragCtx.colRect.left;
            break;
          }
        }
        dragCtx.targetDay = targetCol.dataset.day;
        dragCtx.snappedDx = targetDx;
        dragCtx.block.style.transform = `translate(${targetDx}px, ${snappedDy}px)`;
      } else if (dragCtx.mode === 'resize-top') {
        let newTop = dragCtx.initialTop + snappedDy;
        let newHeight = dragCtx.initialHeight - snappedDy;
        const minHeight = HOUR_HEIGHT * (SNAP_MINUTES / 60);
        if (newHeight < minHeight) { newHeight = minHeight; newTop = dragCtx.initialTop + dragCtx.initialHeight - minHeight; }
        if (newTop < 0) { newHeight -= -newTop; newTop = 0; }
        dragCtx.block.style.top = newTop + 'px';
        dragCtx.block.style.height = newHeight + 'px';
      } else if (dragCtx.mode === 'resize-bottom') {
        let newHeight = dragCtx.initialHeight + snappedDy;
        const minHeight = HOUR_HEIGHT * (SNAP_MINUTES / 60);
        if (newHeight < minHeight) newHeight = minHeight;
        const maxBottom = (DAY_END_HOUR - DAY_START_HOUR) * HOUR_HEIGHT;
        if (dragCtx.initialTop + newHeight > maxBottom) newHeight = maxBottom - dragCtx.initialTop;
        dragCtx.block.style.height = newHeight + 'px';
      }
      // Update displayed time
      const tEl = dragCtx.block.querySelector('.eb-time');
      if (tEl) {
        const newStartMin = pxToMin(parseFloat(dragCtx.block.style.top || dragCtx.initialTop));
        const newEndMin = newStartMin + Math.round(parseFloat(dragCtx.block.style.height || dragCtx.initialHeight) / HOUR_HEIGHT * 60);
        tEl.textContent = `${minutesToTimeStr(newStartMin)}–${minutesToTimeStr(newEndMin)} · ${fmtHourCount(newEndMin - newStartMin)}`;
      }
    }
    function pxToMin(px) {
      return Math.round((DAY_START_HOUR * 60 + (px / HOUR_HEIGHT) * 60) / SNAP_MINUTES) * SNAP_MINUTES;
    }
    function endEntryDrag(ev) {
      if (!dragCtx) return;
      const ctx = dragCtx;
      ctx.block.releasePointerCapture(ev.pointerId);
      ctx.block.classList.remove('dragging');
      document.getElementById('weekGrid')?.classList.remove('dragging');
      document.body.style.userSelect = '';
      ctx.block.removeEventListener('pointermove', onEntryDrag);
      ctx.block.removeEventListener('pointerup', endEntryDrag);
      ctx.block.removeEventListener('pointercancel', endEntryDrag);
      dragCtx = null;
      if (!ctx.moved) {
        setTimeout(() => { didDragMove = false; openTimeEntryModal({ id: ctx.entryId }); }, 0);
        return;
      }
      // Commit
      const entry = state.timeEntries.find(e => e.id === ctx.entryId);
      if (!entry) return;
      let newTop, newHeight;
      if (ctx.mode === 'move') {
        newTop = ctx.initialTop + ctx.snappedDy;
        newHeight = ctx.initialHeight;
      } else if (ctx.mode === 'resize-top') {
        newTop = ctx.initialTop + ctx.snappedDy;
        newHeight = ctx.initialHeight - ctx.snappedDy;
        const minHeight = HOUR_HEIGHT * (SNAP_MINUTES / 60);
        if (newHeight < minHeight) { newHeight = minHeight; newTop = ctx.initialTop + ctx.initialHeight - minHeight; }
        if (newTop < 0) { newHeight -= -newTop; newTop = 0; }
      } else {
        newTop = ctx.initialTop;
        newHeight = ctx.initialHeight + ctx.snappedDy;
        const minHeight = HOUR_HEIGHT * (SNAP_MINUTES / 60);
        if (newHeight < minHeight) newHeight = minHeight;
        const maxBottom = (DAY_END_HOUR - DAY_START_HOUR) * HOUR_HEIGHT;
        if (newTop + newHeight > maxBottom) newHeight = maxBottom - newTop;
      }
      const startMin = Math.round((DAY_START_HOUR * 60 + (newTop / HOUR_HEIGHT) * 60) / SNAP_MINUTES) * SNAP_MINUTES;
      const endMin = startMin + Math.round(newHeight / HOUR_HEIGHT * 60 / SNAP_MINUTES) * SNAP_MINUTES;
      if (startMin < 0 || endMin > 24 * 60 || endMin <= startMin) {
        toast('Posição inválida.', 'error'); render(); return;
      }
      entry.startTime = minutesToTimeStr(startMin);
      entry.endTime = minutesToTimeStr(endMin);
      entry.durationMinutes = endMin - startMin;
      if (ctx.mode === 'move') entry.date = ctx.targetDay;
      saveState();
      render();
      // Reset click flag a tick later, so click handlers don't fire
      setTimeout(() => { didDragMove = false; }, 50);
    }

    function renderMonthGrid() {
      const start = startOfMonth(view.refDate);
      const end = endOfMonth(view.refDate);
      const gridStart = startOfWeek(start);
      const gridEnd = endOfWeek(end);
      const dows = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      let html = '<div class="cal-month-head">' + dows.map(d => `<div>${d}</div>`).join('') + '</div>';
      html += '<div class="cal-month">';
      let cur = new Date(gridStart);
      while (cur <= gridEnd) {
        const dateStr = isoDate(cur);
        const inMonth = cur.getMonth() === start.getMonth();
        const todayCls = isToday(cur) ? 'is-today' : '';
        const wkCls = isWeekend(cur) ? 'is-weekend' : '';
        const entries = state.timeEntries.filter(e => e.date === dateStr);
        const totalMin = entries.reduce((s, e) => s + (e.durationMinutes || 0), 0);
        const visible = entries.slice(0, 3);
        const hidden = entries.length - visible.length;
        const items = visible.map(e => {
          const p = findProject(e.projectId);
          const t = p && findTask(p.id, e.taskId);
          const c = p?.color || '#7c4dff';
          const tc = getContrastColor(c);
          const sub = e.subtaskId && t ? t.subtasks.find(s => s.id === e.subtaskId) : null;
          const parts = [fmtHourCount(e.durationMinutes), t ? t.name : '(sem tarefa)', sub ? sub.name : null, p ? p.name : null, e.note || null].filter(Boolean);
          return `<div class="month-entry" data-entry="${e.id}" style="background:${fadeColor(c, 0.9)};color:${tc};border-left-color:${c}">${escapeHtml(parts.join(' - '))}</div>`;
        }).join('');
        html += `<div class="month-day ${inMonth ? '' : 'outside'} ${todayCls} ${wkCls}" data-day="${dateStr}">
      <div class="row" style="justify-content:space-between">
        <div class="day-num">${cur.getDate()}</div>
        ${totalMin ? `<div class="day-total"><strong>${fmtHourCount(totalMin)}</strong></div>` : ''}
      </div>
      ${items}
      ${hidden > 0 ? `<div class="more">+${hidden} mais</div>` : ''}
    </div>`;
        cur = addDays(cur, 1);
      }
      html += '</div>';
      return html;
    }
    /* --- Month drag-and-drop --- */
    let monthDragTarget = null;
    let monthDragMoved = false;

    function startMonthDrag(ev, entryId) {
      if (ev.button !== 0) return;
      monthDragMoved = false;
      const startX = ev.clientX, startY = ev.clientY;
      const el = ev.currentTarget;
      el.classList.add('dragging');
      el.setPointerCapture(ev.pointerId);

      function onMove(e) {
        if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) monthDragMoved = true;
        document.querySelectorAll('.cal-month .month-day').forEach(d => d.classList.remove('drag-over'));
        const els = document.elementsFromPoint(e.clientX, e.clientY);
        const dayEl = els.find(x => x.classList && x.classList.contains('month-day'));
        if (dayEl) { dayEl.classList.add('drag-over'); monthDragTarget = dayEl.dataset.day; }
        else monthDragTarget = null;
      }
      function onUp(e) {
        el.classList.remove('dragging');
        el.releasePointerCapture(e.pointerId);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        document.querySelectorAll('.cal-month .month-day').forEach(d => d.classList.remove('drag-over'));
        if (!monthDragMoved) { return; }
        const entry = state.timeEntries.find(x => x.id === entryId);
        if (entry && monthDragTarget && entry.date !== monthDragTarget) {
          entry.date = monthDragTarget;
          saveState(); toast('Registro movido.', 'success'); render();
        }
        monthDragTarget = null;
      }
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
      ev.preventDefault(); ev.stopPropagation();
    }

    /* --- Entry tooltip --- */
    let tooltipEl = null;
    function showEntryTooltip(clientX, clientY, entryId) {
      hideEntryTooltip();
      const e = state.timeEntries.find(x => x.id === entryId); if (!e) return;
      const p = findProject(e.projectId);
      const t = p && findTask(p.id, e.taskId);
      const sub = e.subtaskId && t ? t.subtasks.find(s => s.id === e.subtaskId) : null;
      const c = p?.color || '#7c4dff';
      const rows = [
        { label: 'Tempo', value: fmtHourCount(e.durationMinutes) },
        { label: 'Tarefa', value: t ? t.name : '(sem tarefa)' },
        p ? { label: 'Projeto', value: p.name } : null,
        sub ? { label: 'Subtarefa', value: sub.name } : null,
        e.startTime ? { label: 'Horário', value: `${e.startTime} – ${e.endTime}` } : null,
        e.note ? { label: 'Nota', value: e.note } : null,
      ].filter(Boolean);
      const tip = document.createElement('div');
      tip.className = 'month-entry-tooltip';
      tip.innerHTML = `<div class="tet-color-bar" style="background:${c}"></div>
        <div class="tet-title">${escapeHtml(t ? t.name : '(sem tarefa)')}</div>
        ${rows.map(r => `<div class="tet-row"><span class="tet-label">${r.label}</span><span>${escapeHtml(r.value)}</span></div>`).join('')}`;
      document.body.appendChild(tip);
      positionTooltip(tip, clientX, clientY);
      tooltipEl = tip;
    }
    function positionTooltip(tip, x, y) {
      const w = tip.offsetWidth || 240, h = tip.offsetHeight || 120;
      let left = x + 14, top = y + 14;
      if (left + w > window.innerWidth - 8) left = x - w - 14;
      if (top + h > window.innerHeight - 8) top = y - h - 14;
      tip.style.left = Math.max(8, left) + 'px';
      tip.style.top = Math.max(8, top) + 'px';
    }
    function hideEntryTooltip() {
      if (tooltipEl) { tooltipEl.remove(); tooltipEl = null; }
    }

    /* --- Context menu --- */
    let ctxMenuEl = null;
    function closeCtxMenu() {
      if (ctxMenuEl) { ctxMenuEl.remove(); ctxMenuEl = null; }
      document.removeEventListener('mousedown', ctxMenuOutside, true);
    }
    function ctxMenuOutside(e) {
      if (ctxMenuEl && !ctxMenuEl.contains(e.target)) closeCtxMenu();
    }
    function showCtxMenu(x, y, items) {
      closeCtxMenu();
      const el = document.createElement('div');
      el.className = 'ctx-menu';
      items.forEach(item => {
        if (item.sep) { el.appendChild(Object.assign(document.createElement('div'), { className: 'ctx-menu-sep' })); return; }
        const btn = document.createElement('div');
        btn.className = 'ctx-menu-item' + (item.danger ? ' danger' : '');
        btn.innerHTML = `<svg class="icon"><use href="#${item.icon}"/></svg>${escapeHtml(item.label)}`;
        btn.addEventListener('click', () => { closeCtxMenu(); item.action(); });
        el.appendChild(btn);
      });
      document.getElementById('popover-root').appendChild(el);
      const w = 180;
      let left = x, top = y;
      const h = el.offsetHeight || 120;
      if (left + w > window.innerWidth - 8) left = x - w;
      if (top + h > window.innerHeight - 8) top = y - h;
      el.style.left = Math.max(8, left) + 'px';
      el.style.top = Math.max(8, top) + 'px';
      ctxMenuEl = el;
      setTimeout(() => document.addEventListener('mousedown', ctxMenuOutside, true), 0);
    }
    function onEntryContextMenu(ev, entryId) {
      ev.preventDefault(); ev.stopPropagation();
      hideEntryTooltip();
      showCtxMenu(ev.clientX, ev.clientY, [
        { icon: 'i-pencil', label: 'Editar', action: () => openTimeEntryModal({ id: entryId }) },
        { icon: 'i-plus', label: 'Duplicar', action: () => duplicateEntry(entryId) },
        { sep: true },
        { icon: 'i-trash', label: 'Excluir', danger: true, action: () => deleteEntry(entryId) },
      ]);
    }
    function duplicateEntry(id) {
      const orig = state.timeEntries.find(e => e.id === id); if (!orig) return;
      const dup = { ...orig, id: null };
      timeEntryDraft = { ...dup, mode: dup.startTime ? 'range' : 'duration' };
      renderTimeEntryModal();
    }

    function attachMonthEvents() {
      document.querySelectorAll('.cal-month .month-day').forEach(el => {
        el.addEventListener('click', (ev) => {
          if (ev.target.closest('.month-entry')) return;
          openTimeEntryModal({ date: el.dataset.day, mode: 'duration' });
        });
      });
      document.querySelectorAll('.cal-month .month-entry').forEach(el => {
        el.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (!monthDragMoved) openTimeEntryModal({ id: el.dataset.entry });
        });
        el.addEventListener('pointerdown', (ev) => {
          if (ev.button !== 0) return;
          startMonthDrag(ev, el.dataset.entry);
        });
        el.addEventListener('contextmenu', (ev) => onEntryContextMenu(ev, el.dataset.entry));
        el.addEventListener('mouseenter', (ev) => showEntryTooltip(ev.clientX, ev.clientY, el.dataset.entry));
        el.addEventListener('mousemove', (ev) => { if (tooltipEl) positionTooltip(tooltipEl, ev.clientX, ev.clientY); });
        el.addEventListener('mouseleave', () => hideEntryTooltip());
      });
    }

    /* ============================================================
       TASKS VIEW
       ============================================================ */
    let tasksFilter = {
      tagId: '', categoryId: '', projectId: '', search: '', completed: 'all',
      rangePreset: 'all', rangeFrom: '', rangeTo: ''
    };
    let tasksFiltersOpen = false;

    let recordsFilter = {
      search: '', projectId: '', taskId: '', subtaskId: '',
      categoryId: '', tagId: '',
      rangePreset: 'all', rangeFrom: '', rangeTo: ''
    };
    let recordsFiltersOpen = true;

    let taskDetailFilter = { search: '', date: '', subtaskId: '' };
    function updateTaskDetailFilter(key, val) {
      taskDetailFilter[key] = val;
      if (key === 'search') {
        renderTaskDetail(document.getElementById('view-root'));
        const inp = document.querySelector('#view-root .card-header .search-wrap .input');
        if (inp) { inp.focus(); inp.setSelectionRange(val.length, val.length); }
      } else render();
    }

    function rangeForPreset(preset) {
      const today = stripTime(new Date());
      if (preset === 'today') return { from: isoDate(today), to: isoDate(today) };
      if (preset === 'week') return { from: isoDate(startOfWeek(today)), to: isoDate(endOfWeek(today)) };
      if (preset === 'month') return { from: isoDate(startOfMonth(today)), to: isoDate(endOfMonth(today)) };
      if (preset === 'lastMonth') {
        const prev = addMonths(today, -1);
        return { from: isoDate(startOfMonth(prev)), to: isoDate(endOfMonth(prev)) };
      }
      return null;
    }

    function entryMatchesRange(entry, preset, customFrom, customTo) {
      if (preset === 'all') return true;
      let from, to;
      if (preset === 'custom') { from = customFrom; to = customTo; }
      else { const r = rangeForPreset(preset); if (!r) return true; from = r.from; to = r.to; }
      if (from && entry.date < from) return false;
      if (to && entry.date > to) return false;
      return true;
    }

    function renderTasks(root) {
      const f = tasksFilter;
      const tagOptions = ['<option value="">Todas as tags</option>']
        .concat(state.tags.map(tg => `<option value="${tg.id}" ${f.tagId === tg.id ? 'selected' : ''}>${escapeHtml(tg.name)}</option>`)).join('');
      const catOptions = ['<option value="">Todas as categorias</option>']
        .concat(state.categories.map(c => `<option value="${c.id}" ${f.categoryId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`)).join('');
      const projOptions = ['<option value="">Todos os projetos</option>']
        .concat(state.projects.map(p => `<option value="${p.id}" ${f.projectId === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`)).join('');

      // Filter projects by category, projectId and date range first
      const filteredEntries = (e) => entryMatchesRange(e, f.rangePreset, f.rangeFrom, f.rangeTo);
      const projects = state.projects.filter(p => {
        if (f.categoryId && p.categoryId !== f.categoryId) return false;
        if (f.projectId && p.id !== f.projectId) return false;
        return true;
      }).sort((a, b) => {
        const da = projectComputedDates(a).start || '9999-99-99';
        const db = projectComputedDates(b).start || '9999-99-99';
        return da.localeCompare(db);
      });

      // Build groups: for each project, list its tasks (filtered)
      const groups = projects.map(p => {
        const tasks = p.tasks.filter(t => {
          const completed = t.completed;
          if (f.completed === 'open' && completed) return false;
          if (f.completed === 'done' && !completed) return false;
          if (f.tagId && !t.tagIds.includes(f.tagId)) return false;
          if (f.search) {
            const s = f.search.toLowerCase();
            const hay = `${p.name} ${t.name} ${t.subtasks.map(x => x.name).join(' ')}`.toLowerCase();
            if (!hay.includes(s)) return false;
          }
          // Date range: must have at least one entry within the range (or no range = all)
          if (f.rangePreset !== 'all') {
            const taskEntries = state.timeEntries.filter(e => e.projectId === p.id && e.taskId === t.id && filteredEntries(e));
            if (taskEntries.length === 0) return false;
          }
          return true;
        }).sort((a, b) => {
          const startA = state.timeEntries.filter(e => e.projectId === p.id && e.taskId === a.id).map(e => e.date).sort()[0] || '9999-99-99';
          const startB = state.timeEntries.filter(e => e.projectId === p.id && e.taskId === b.id).map(e => e.date).sort()[0] || '9999-99-99';
          return startA.localeCompare(startB);
        });

        // A project matches if it matches the search OR has matching tasks
        let projectMatchesSearch = true;
        if (f.search) {
          const s = f.search.toLowerCase();
          projectMatchesSearch = p.name.toLowerCase().includes(s);
        }

        return { project: p, tasks, projectMatchesSearch };
      }).filter(g => g.tasks.length > 0 || g.projectMatchesSearch);

      const totalTasks = groups.reduce((s, g) => s + g.tasks.length, 0);

      let body;
      if (state.projects.length === 0) {
        body = `<div class="empty-state">
      <svg class="icon"><use href="#i-empty"/></svg>
      <h3>Nenhum projeto ainda</h3>
      <p>Comece criando um projeto para organizar suas tarefas.</p>
      <button class="btn mt-12" onclick="openProjectModal()"><svg class="icon"><use href="#i-plus"/></svg> Novo projeto</button>
    </div>`;
      } else if (groups.length === 0) {
        body = `<div class="empty-state">
      <svg class="icon"><use href="#i-empty"/></svg>
      <h3>Nenhum projeto ou tarefa corresponde aos filtros</h3>
      <p>Tente ajustar os filtros de busca, categoria ou período.</p>
    </div>`;
      } else {
        body = groups.map(g => {
          const p = g.project;
          const total = projectTotalMinutes(p.id);
          const dates = projectComputedDates(p);
          const cat = getCategoryById(p.categoryId);
          const allComplete = p.tasks.length > 0 && p.tasks.every(t => t.completed);
          let taskRows = g.tasks.map(t => {
            const totalT = taskTotalMinutes(p.id, t.id);
            const taskEntries = state.timeEntries.filter(e => e.projectId === p.id && e.taskId === t.id);
            const tDates = taskEntries.map(e => e.date).sort();
            const completed = t.completed;
            const tagsHtml = t.tagIds.map(tid => {
              const tg = getTagById(tid);
              if (!tg) return '';
              return `<span class="chip-bg clickable" style="${chipBgStyle(tg.color)}" onclick="event.stopPropagation();filterByTag('${tg.id}')">${escapeHtml(tg.name)}</span>`;
            }).join(' ');
            const completeIcon = completed ? 'i-reopen' : 'i-check';
            const completeLabel = completed ? 'Reabrir' : 'Concluir';
            const completeCls = completed ? 'icon-btn' : 'icon-btn success';
            const subRows = t.subtasks.map(s => {
              const subEntries = state.timeEntries.filter(e => e.projectId === p.id && e.taskId === t.id && e.subtaskId === s.id);
              const subTotal = subEntries.reduce((sum, e) => sum + (e.durationMinutes || 0), 0);
              const subDates = subEntries.map(e => e.date).sort();
              const sCompleted = s.completed;
              return `<tr class="subtask-row">
            <td><span class="subtask-name">↳ ${escapeHtml(s.name)}</span></td>
            <td></td>
            <td>${subDates[0] ? fmtDateBR(subDates[0]) : '<span class="muted">—</span>'}</td>
            <td>${subDates[subDates.length - 1] ? fmtDateBR(subDates[subDates.length - 1]) : '<span class="muted">—</span>'}</td>
            <td class="num">${subTotal ? `<strong>${fmtHourCount(subTotal)}</strong>` : '<span class="muted">—</span>'}</td>
            <td>${sCompleted ? '<span class="badge success">Concluída</span>' : '<span class="badge gray status">Pendente</span>'}</td>
            <td>
              <div class="row-actions">
                <button class="icon-btn" title="Registrar tempo" onclick="openTimeEntryModal({projectId:'${p.id}',taskId:'${t.id}',subtaskId:'${s.id}'})"><svg class="icon"><use href="#i-timer-add"/></svg></button>
                <button class="icon-btn" title="Editar subtarefa" onclick="editSubtask('${p.id}','${t.id}','${s.id}')"><svg class="icon"><use href="#i-pencil"/></svg></button>
                <button class="icon-btn ${sCompleted ? '' : 'success'}" title="${sCompleted ? 'Reabrir' : 'Concluir'}" onclick="toggleSubtaskComplete('${p.id}','${t.id}','${s.id}')"><svg class="icon"><use href="#${sCompleted ? 'i-reopen' : 'i-check'}"/></svg></button>
                <button class="icon-btn danger" title="Excluir subtarefa" onclick="deleteSubtask('${p.id}','${t.id}','${s.id}')"><svg class="icon"><use href="#i-trash"/></svg></button>
              </div>
            </td>
          </tr>`;
            }).join('');
            return `<tr class="task-row">
            <td><span class="task-name link-purple" onclick="openTaskDetail('${p.id}','${t.id}')">${escapeHtml(t.name)}</span></td>
            <td>${tagsHtml}</td>
            <td>${tDates[0] ? fmtDateBR(tDates[0]) : '<span class="muted">—</span>'}</td>
            <td>${tDates[tDates.length - 1] ? fmtDateBR(tDates[tDates.length - 1]) : '<span class="muted">—</span>'}</td>
            <td class="num"><strong>${fmtHourCount(totalT)}</strong></td>
            <td>${completed ? '<span class="badge success">Concluída</span>' : '<span class="badge gray status">Pendente</span>'}</td>
            <td>
              <div class="row-actions">
                <!-- <button class="icon-btn" title="Detalhes" onclick="openTaskDetail('${p.id}','${t.id}')"><svg class="icon"><use href="#i-eye"/></svg></button> -->
                <button class="icon-btn" title="Adicionar registro" onclick="openTimeEntryModal({projectId:'${p.id}',taskId:'${t.id}'})"><svg class="icon"><use href="#i-timer-add"/></svg></button>
                <button class="icon-btn" title="Editar tarefa" onclick="openTaskModal('${p.id}','${t.id}')"><svg class="icon"><use href="#i-pencil"/></svg></button>
                <button class="${completeCls}" title="${completeLabel}" onclick="toggleTaskComplete('${p.id}','${t.id}')"><svg class="icon"><use href="#${completeIcon}"/></svg></button>
                <button class="icon-btn danger" title="Excluir tarefa" onclick="deleteTask('${p.id}','${t.id}')"><svg class="icon"><use href="#i-trash"/></svg></button>
              </div>
            </td>
          </tr>${subRows}`;
          }).join('');

          if (!taskRows) {
            const hasTasks = p.tasks.length > 0;
            const msg = hasTasks
              ? 'Nenhuma tarefa corresponde aos filtros selecionados para este projeto.'
              : 'Ainda não há tarefas cadastradas neste projeto.';
            taskRows = `<tr><td colspan="7" class="muted" style="text-align:center;padding:32px;background:var(--c-surface)">${msg}</td></tr>`;
          }

          const projDate = (dates.start || dates.end)
            ? `${dates.start ? fmtDateBR(dates.start) : '—'} → ${dates.end ? fmtDateBR(dates.end) : 'sem fim'}${allComplete ? ' <span class="badge success">finalizado</span>' : ''}`
            : '<span class="muted">sem datas</span>';

          return `<div class="card table-card mb-16">
        <div class="card-header">
          <div class="gh-row" style="width:100%">
            <div class="gh-main">
              <div class="gh-name">
                <span class="gh-color" style="background:${escapeAttr(p.color)}"></span>
                ${escapeHtml(p.name)}
              </div>
              <div class="gh-meta">
                <span>Tarefas: ${p.tasks.length} </span>
                <span class="muted">·</span>
                <span>${projDate}</span>
              </div>
            </div>
            <strong style="font-size: 18px;">${fmtHourCount(total)}</strong>
            ${cat ? `<span class="chip-bg clickable" style="${chipBgStyle(cat.color)}" onclick="filterByCategory('${cat.id}')">${escapeHtml(cat.name)}</span>` : ''}
            <div class="gh-actions">
              <button class="btn-secondary btn" onclick="openTaskModal('${p.id}')" style="padding:6px 10px;font-size:12.5px"><svg class="icon"><use href="#i-plus"/></svg> Nova tarefa</button>
              <button class="icon-btn" title="Editar projeto" onclick="openProjectModal('${p.id}')"><svg class="icon"><use href="#i-pencil"/></svg></button>
            </div>
          </div>
        </div>
        <div class="table-overflow">
          <table class="data-table">
            <thead>
              <tr><th>Tarefa</th><th>Tags</th><th>Início</th><th>Fim</th><th class="num">Tempo</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
              ${taskRows}
            </tbody>
          </table>
        </div>
      </div>`;
        }).join('');
      }

      const customRangeHtml = f.rangePreset === 'custom'
        ? `<div class="row gap-sm" style="flex:1 1 220px;min-width:220px">
        <input type="date" class="input compact" value="${f.rangeFrom}" onchange="updateTaskFilter('rangeFrom', this.value)" />
        <span class="muted small">até</span>
        <input type="date" class="input compact" value="${f.rangeTo}" onchange="updateTaskFilter('rangeTo', this.value)" />
      </div>` : '';

      root.innerHTML = `
    <div class="card mb-16">
      <div class="table-toolbar">
        <button class="btn-secondary btn filter-toggle" onclick="tasksFiltersOpen=!tasksFiltersOpen;render()"><svg class="icon"><use href="#i-filter"/></svg> Filtros ${tasksFiltersOpen ? '' : '<svg class=\"icon\"><use href=\"#i-chev-d\"/></svg>'}</button>
        <div class="filter-bar ${tasksFiltersOpen ? '' : ''}" id="filterBar">
          <div class="search-wrap">
            <svg class="icon icon-search" width="16" height="16"><use href="#i-search"/></svg>
            <input class="input compact" placeholder="Buscar tarefa…" value="${escapeAttr(tasksFilter.search)}" oninput="updateTaskFilter('search', this.value)" />
          </div>
          <select class="select compact" onchange="updateTaskFilter('projectId', this.value)">${projOptions}</select>
          <select class="select compact" onchange="updateTaskFilter('tagId', this.value)">${tagOptions}</select>
          <select class="select compact" onchange="updateTaskFilter('categoryId', this.value)">${catOptions}</select>
          <select class="select compact" onchange="updateTaskFilter('rangePreset', this.value)">
            <option value="all" ${f.rangePreset === 'all' ? 'selected' : ''}>Todo o período</option>
            <option value="today" ${f.rangePreset === 'today' ? 'selected' : ''}>Hoje</option>
            <option value="week" ${f.rangePreset === 'week' ? 'selected' : ''}>Esta semana</option>
            <option value="month" ${f.rangePreset === 'month' ? 'selected' : ''}>Este mês</option>
            <option value="lastMonth" ${f.rangePreset === 'lastMonth' ? 'selected' : ''}>Mês anterior</option>
            <option value="custom" ${f.rangePreset === 'custom' ? 'selected' : ''}>Personalizado…</option>
          </select>
          ${customRangeHtml}
          <div class="pill-tabs">
            <button class="${tasksFilter.completed === 'all' ? 'active' : ''}" onclick="updateTaskFilter('completed','all')">Todas</button>
            <button class="${tasksFilter.completed === 'open' ? 'active' : ''}" onclick="updateTaskFilter('completed','open')">Abertas</button>
            <button class="${tasksFilter.completed === 'done' ? 'active' : ''}" onclick="updateTaskFilter('completed','done')">Concluídas</button>
          </div>
        </div>
      </div>
    </div>
    ${body}
  `;
      // Apply mobile collapse
      const fb = document.getElementById('filterBar');
      if (fb && window.innerWidth < 880 && !tasksFiltersOpen) fb.classList.add('collapsed');
    }

    function updateTaskFilter(key, val) {
      tasksFilter[key] = val;
      if (key === 'rangePreset' && val !== 'custom') {
        tasksFilter.rangeFrom = ''; tasksFilter.rangeTo = '';
      }
      saveFilters();
      if (key === 'search') {
        renderTasks(document.getElementById('view-root'));
        const inp = document.querySelector('#filterBar .input');
        if (inp) { inp.focus(); inp.setSelectionRange(val.length, val.length); }
      } else render();
    }
    function filterByTag(tagId) { tasksFilter.tagId = tagId; saveFilters(); render(); }
    function filterByCategory(catId) { tasksFilter.categoryId = catId; saveFilters(); render(); }

    function goToProjectTasks(projectId) {
      tasksFilter.projectId = projectId;
      view.name = 'tasks'; view.taskRef = null;
      saveFilters(); render();
    }

    function updateRecordsFilter(key, val) {
      recordsFilter[key] = val;
      if (key === 'projectId') { recordsFilter.taskId = ''; recordsFilter.subtaskId = ''; }
      if (key === 'taskId') { recordsFilter.subtaskId = ''; }
      if (key === 'rangePreset' && val !== 'custom') { recordsFilter.rangeFrom = ''; recordsFilter.rangeTo = ''; }
      saveFilters();
      if (key === 'search') {
        renderRecords(document.getElementById('view-root'));
        const inp = document.querySelector('#recordsFilterBar .input');
        if (inp) { inp.focus(); inp.setSelectionRange(val.length, val.length); }
      } else render();
    }

    function toggleTaskComplete(projectId, taskId) {
      const t = findTask(projectId, taskId);
      if (!t) return;
      t.completed = !t.completed;
      saveState(); render();
    }
    function toggleSubtaskComplete(projectId, taskId, subId) {
      const s = findSubtask(projectId, taskId, subId);
      if (!s) return;
      s.completed = !s.completed;
      saveState(); render();
    }
    function deleteTask(projectId, taskId) {
      const used = state.timeEntries.filter(e => e.projectId === projectId && e.taskId === taskId).length;
      const msg = used ? `Excluir a tarefa e ${used} registro(s) associados?` : 'Excluir esta tarefa?';
      if (!confirm(msg)) return;
      const p = findProject(projectId); if (!p) return;
      p.tasks = p.tasks.filter(t => t.id !== taskId);
      state.timeEntries = state.timeEntries.filter(e => !(e.projectId === projectId && e.taskId === taskId));
      saveState(); render();
      toast('Tarefa excluída.');
    }
    function editSubtask(projectId, taskId, subId) {
      const t = findTask(projectId, taskId);
      const s = t && t.subtasks.find(x => x.id === subId);
      if (!s) return;
      const newName = prompt('Nome da subtarefa:', s.name);
      if (newName !== null && newName.trim()) {
        s.name = newName.trim();
        saveState(); render();
      }
    }
    function deleteSubtask(projectId, taskId, subId) {
      if (!confirm('Excluir esta subtarefa?')) return;
      const t = findTask(projectId, taskId);
      if (!t) return;
      t.subtasks = t.subtasks.filter(s => s.id !== subId);
      state.timeEntries.forEach(e => { if (e.subtaskId === subId) e.subtaskId = null; });
      saveState(); render();
      toast('Subtarefa excluída.');
    }

    /* ============================================================
       RECORDS VIEW
       ============================================================ */
    function renderRecords(root) {
      const f = recordsFilter;

      // Build select options
      const projOptions = ['<option value="">Todos os projetos</option>']
        .concat(state.projects.map(p => `<option value="${p.id}" ${f.projectId === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`)).join('');

      const selectedProj = f.projectId ? state.projects.find(p => p.id === f.projectId) : null;
      const taskPool = selectedProj
        ? selectedProj.tasks.map(t => ({ id: t.id, name: t.name, projectId: selectedProj.id }))
        : state.projects.flatMap(p => p.tasks.map(t => ({ id: t.id, name: t.name, projectId: p.id, projectName: p.name })));
      const taskOptions = ['<option value="">Todas as tarefas</option>']
        .concat(taskPool.map(t => {
          const label = selectedProj ? escapeHtml(t.name) : `${escapeHtml(t.projectName)} › ${escapeHtml(t.name)}`;
          return `<option value="${t.id}" ${f.taskId === t.id ? 'selected' : ''}>${label}</option>`;
        })).join('');

      const selectedTask = f.taskId ? (() => {
        for (const p of state.projects) { const t = p.tasks.find(x => x.id === f.taskId); if (t) return t; }
        return null;
      })() : null;
      const subPool = selectedTask ? selectedTask.subtasks : [];
      const subtaskOptions = ['<option value="">Todas as subtarefas</option>']
        .concat(subPool.map(s => `<option value="${s.id}" ${f.subtaskId === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`)).join('');

      const catOptions = ['<option value="">Todas as categorias</option>']
        .concat(state.categories.map(c => `<option value="${c.id}" ${f.categoryId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`)).join('');
      const tagOptions = ['<option value="">Todas as tags</option>']
        .concat(state.tags.map(tg => `<option value="${tg.id}" ${f.tagId === tg.id ? 'selected' : ''}>${escapeHtml(tg.name)}</option>`)).join('');

      const customRangeHtml = f.rangePreset === 'custom' ? `
        <div class="row gap-sm" style="flex:1 1 220px;min-width:220px">
          <input type="date" class="input compact" value="${escapeAttr(f.rangeFrom)}" onchange="updateRecordsFilter('rangeFrom',this.value)" />
          <span class="muted small">até</span>
          <input type="date" class="input compact" value="${escapeAttr(f.rangeTo)}" onchange="updateRecordsFilter('rangeTo',this.value)" />
        </div>` : '';

      // Filter entries
      const filtered = state.timeEntries.filter(e => {
        if (!entryMatchesRange(e, f.rangePreset, f.rangeFrom, f.rangeTo)) return false;
        if (f.projectId && e.projectId !== f.projectId) return false;
        if (f.taskId && e.taskId !== f.taskId) return false;
        if (f.subtaskId && e.subtaskId !== f.subtaskId) return false;
        if (f.categoryId) {
          const proj = state.projects.find(p => p.id === e.projectId);
          if (!proj || proj.categoryId !== f.categoryId) return false;
        }
        if (f.tagId) {
          const task = findTask(e.projectId, e.taskId);
          if (!task || !task.tagIds.includes(f.tagId)) return false;
        }
        if (f.search && !(e.note || '').toLowerCase().includes(f.search.toLowerCase())) return false;
        return true;
      }).sort((a, b) => b.date.localeCompare(a.date) || (b.startTime || '').localeCompare(a.startTime || ''));

      const totalMin = filtered.reduce((s, e) => s + (e.durationMinutes || 0), 0);

      // Build table rows
      const rows = filtered.length ? filtered.map(e => {
        const proj = state.projects.find(p => p.id === e.projectId);
        const task = proj ? proj.tasks.find(t => t.id === e.taskId) : null;
        const sub = task && e.subtaskId ? task.subtasks.find(s => s.id === e.subtaskId) : null;
        const cat = proj && proj.categoryId ? state.categories.find(c => c.id === proj.categoryId) : null;
        const tags = task ? task.tagIds.map(tid => getTagById(tid)).filter(Boolean) : [];

        const projCell = proj
          ? `<span class="link-purple" onclick="goToProjectTasks('${proj.id}')">${escapeHtml(proj.name)}</span>`
          : '<span class="muted">—</span>';
        const taskCell = task
          ? `<span class="link-purple" onclick="openTaskDetail('${proj.id}','${task.id}')">${escapeHtml(task.name)}</span>`
          : '<span class="muted">—</span>';
        const catCell = cat
          ? `<span class="chip-bg clickable" style="${chipBgStyle(cat.color)}" onclick="recordsFilter.categoryId='${cat.id}';saveFilters();render()">${escapeHtml(cat.name)}</span>`
          : '<span class="muted">—</span>';
        const tagsCell = tags.length
          ? tags.map(tg => `<span class="chip-bg clickable" style="${chipBgStyle(tg.color)}" onclick="recordsFilter.tagId='${tg.id}';saveFilters();render()">${escapeHtml(tg.name)}</span>`).join(' ')
          : '<span class="muted">—</span>';

        return `<tr>
          <td style="white-space:nowrap">${escapeHtml(fmtDateBR(e.date))}</td>
          <td style="white-space:nowrap">${e.startTime ? `${e.startTime} – ${e.endTime}` : '<span class="muted">—</span>'}</td>
          <td>${projCell}</td>
          <td>${taskCell}</td>
          <td>${sub ? escapeHtml(sub.name) : '<span class="muted">—</span>'}</td>
          <td style="max-width:200px">${e.note ? escapeHtml(e.note) : '<span class="muted">—</span>'}</td>
          <td>${catCell}</td>
          <td style="white-space:nowrap">${tagsCell}</td>
          <td class="num strong" style="white-space:nowrap">${fmtHourCount(e.durationMinutes)}</td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" title="Editar" onclick="openTimeEntryModal({id:'${e.id}'})"><svg class="icon"><use href="#i-pencil"/></svg></button>
              <button class="icon-btn danger" title="Excluir" onclick="deleteEntry('${e.id}')"><svg class="icon"><use href="#i-trash"/></svg></button>
            </div>
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="10" class="muted" style="text-align:center;padding:24px">Nenhum registro encontrado.</td></tr>`;

      root.innerHTML = `
    <div class="card mb-16">
      <div class="table-toolbar">
        <button class="btn-secondary btn filter-toggle" onclick="recordsFiltersOpen=!recordsFiltersOpen;render()">
          <svg class="icon"><use href="#i-filter"/></svg> Filtros
          ${recordsFiltersOpen ? '' : '<svg class="icon"><use href="#i-chev-d"/></svg>'}
        </button>
        <div class="filter-bar" id="recordsFilterBar">
          <div class="search-wrap">
            <svg class="icon icon-search" width="16" height="16"><use href="#i-search"/></svg>
            <input class="input compact" placeholder="Buscar nota…" value="${escapeAttr(f.search)}" oninput="updateRecordsFilter('search',this.value)" />
          </div>
          <select class="select compact" onchange="updateRecordsFilter('projectId',this.value)">${projOptions}</select>

    /* ============================================================
       REPORTS VIEW
       ============================================================ */
    let reportFilter = { rangePreset: 'week', rangeFrom: '', rangeTo: '' };
    function renderReports(root) {
      const f = reportFilter;
      let start, end;
      if (f.rangePreset === 'custom') {
        start = f.rangeFrom ? parseDate(f.rangeFrom) : new Date(2000, 0, 1);
        end = f.rangeTo ? parseDate(f.rangeTo) : new Date(2100, 0, 1);
      } else if (f.rangePreset === 'all') {
        start = new Date(2000, 0, 1); end = new Date(2100, 0, 1);
      } else {
        const r = rangeForPreset(f.rangePreset);
        start = parseDate(r.from); end = parseDate(r.to);
      }

      const inRange = state.timeEntries.filter(e => {
        const d = parseDate(e.date); return d >= start && d <= end;
      });
      const totalMin = inRange.reduce((s, e) => s + (e.durationMinutes || 0), 0);
      const distinctDays = new Set(inRange.map(e => e.date)).size;
      const distinctProjects = new Set(inRange.map(e => e.projectId)).size;
      const avgPerDay = distinctDays ? Math.round(totalMin / distinctDays) : 0;

      const byProject = {};
      inRange.forEach(e => byProject[e.projectId] = (byProject[e.projectId] || 0) + (e.durationMinutes || 0));
      const projRows = Object.entries(byProject)
        .map(([id, min]) => ({ project: findProject(id), min }))
        .filter(r => r.project)
        .sort((a, b) => b.min - a.min);

      const days = [];
      if (f.rangePreset !== 'all' && (end - start) < 1000 * 60 * 60 * 24 * 60) {
        let cur = new Date(start);
        while (cur <= end) {
          const dStr = isoDate(cur);
          const sum = inRange.filter(e => e.date === dStr).reduce((s, e) => s + (e.durationMinutes || 0), 0);
          days.push({ date: new Date(cur), min: sum });
          cur = addDays(cur, 1);
        }
      } else {
        const grouped = {};
        inRange.forEach(e => grouped[e.date] = (grouped[e.date] || 0) + (e.durationMinutes || 0));
        Object.entries(grouped).sort().slice(-30).forEach(([d, m]) => days.push({ date: parseDate(d), min: m }));
      }
      const maxBar = Math.max(1, ...days.map(d => d.min));
      const bars = days.map(d => `
    <div class="bar">
      <div class="bar-fill" style="height:${(d.min / maxBar) * 200}px"><span class="tip">${fmtHourCount(d.min)}</span></div>
      <div class="label">${d.date.getDate()}/${d.date.getMonth() + 1}</div>
    </div>`).join('');

      const byTag = {};
      inRange.forEach(e => {
        const t = findTask(e.projectId, e.taskId);
        if (!t) return;
        t.tagIds.forEach(tid => byTag[tid] = (byTag[tid] || 0) + (e.durationMinutes || 0));
      });
      const tagRows = Object.entries(byTag)
        .map(([id, min]) => ({ tag: getTagById(id), min }))

      const customRangeHtml = f.rangePreset === 'custom'
        ? `<div class="row gap-sm">
        <input type="date" class="input compact" value="${f.rangeFrom}" onchange="updateReportFilter('rangeFrom', this.value)" />
        <span class="muted small">até</span>
        <input type="date" class="input compact" value="${f.rangeTo}" onchange="updateReportFilter('rangeTo', this.value)" />
      </div>` : '';

      root.innerHTML = `
    <div class="row mb-16" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div class="row gap-sm" style="flex-wrap:wrap">
        <div class="pill-tabs">
          <button class="${f.rangePreset === 'today' ? 'active' : ''}" onclick="setReportRange('today')">Hoje</button>
          <button class="${f.rangePreset === 'week' ? 'active' : ''}" onclick="setReportRange('week')">Esta semana</button>
          <button class="${f.rangePreset === 'month' ? 'active' : ''}" onclick="setReportRange('month')">Este mês</button>
          <button class="${f.rangePreset === 'lastMonth' ? 'active' : ''}" onclick="setReportRange('lastMonth')">Mês anterior</button>
          <button class="${f.rangePreset === 'custom' ? 'active' : ''}" onclick="setReportRange('custom')">Personalizado</button>
          <button class="${f.rangePreset === 'all' ? 'active' : ''}" onclick="setReportRange('all')">Tudo</button>
        </div>
        ${customRangeHtml}
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total</div><div class="value">${fmtHourCount(totalMin)}</div><div class="sub">${inRange.length} registros</div></div>
      <div class="stat-card"><div class="label">Dias com registros</div><div class="value">${distinctDays}</div><div class="sub">${avgPerDay ? 'média ' + fmtHourCount(avgPerDay) + '/dia' : '—'}</div></div>
      <div class="stat-card"><div class="label">Projetos ativos</div><div class="value">${distinctProjects}</div><div class="sub">de ${state.projects.length} totais</div></div>
      <div class="stat-card"><div class="label">Tarefas concluídas</div><div class="value">${state.projects.reduce((s, p) => s + p.tasks.filter(t => t.completed).length, 0)}</div><div class="sub">no histórico</div></div>
    </div>

    <div class="card mb-16">

            <div class="breakdown-bar"><span style="width:${(r.min / totalMin * 100) || 0}%;background:${escapeAttr(r.project.color)}"></span></div>
            <div class="num"><strong>${fmtHourCount(r.min)}</strong></div>
          </div>`).join('') : '<div class="muted small" style="padding:18px">Sem dados.</div>'}
      </div>
      <div class="card">
        <div class="card-header"><strong>Por tag</strong></div>

          </div>`).join('') : '<div class="muted small" style="padding:18px">Sem dados.</div>'}
      </div>
    </div>
  `;
    }

      <div class="card">

        <div class="card-body">
          <div class="info-list">
            <div class="info-row"><div class="label">Projeto</div><div class="value"><span class="row gap-sm"><span class="swatch-mini" style="background:${escapeAttr(p.color)}"></span>${escapeHtml(p.name)}</span></div></div>
            <div class="info-row"><div class="label">Categoria</div><div class="value">${cat ? `<span class="chip-bg" style="${chipBgStyle(cat.color)}">${escapeHtml(cat.name)}</span>` : '<span class="muted small">nenhuma</span>'}</div></div>
            <div class="info-row"><div class="label">Total do projeto</div><div class="value"><strong>${fmtHourCount(projectTotalMinutes(p.id))}</strong></div></div>

    <div class="card" style="margin-top:14px;">
      <div class="card-header" style="flex-wrap:wrap;gap:8px">

          <svg class="icon icon-search" width="16" height="16"><use href="#i-search"/></svg>
          <input class="input compact" placeholder="Buscar nota…" value="${escapeAttr(df.search)}" oninput="updateTaskDetailFilter('search',this.value)" />

        <input class="input compact" type="date" value="${escapeAttr(df.date)}" onchange="updateTaskDetailFilter('date',this.value)" style="width:150px" title="Filtrar por data" />
        ${t.subtasks.length ? `<select class="select compact" onchange="updateTaskDetailFilter('subtaskId',this.value)" style="max-width:180px">${subtaskOptions}</select>` : ''}
        ${df.search || df.date || df.subtaskId ? `<button class="icon-btn" title="Limpar filtros" onclick="taskDetailFilter={search:'',date:'',subtaskId:''};render()"><svg class="icon"><use href="#i-x"/></svg></button>` : ''}
      </div>
